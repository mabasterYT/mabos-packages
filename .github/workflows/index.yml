# MabOS's program index (scripts/index.py): what nixos-unstable can install now, and the history
# of versions, in the "index" release. Daily and by hand.
name: Build the program index

on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Build and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view index -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create index -R "$GITHUB_REPOSITORY" --title "Program index" \
              --notes "MabOS's index of what nixos-unstable can install, and the history of versions (scripts/index.py)."
          mkdir -p previous out
          gh release download index -R "$GITHUB_REPOSITORY" -p versions.json.gz -D previous 2>/dev/null || true
          python3 scripts/index.py --previous previous/versions.json.gz out
          gh release upload index -R "$GITHUB_REPOSITORY" --clobber out/index.json.gz out/versions.json.gz
