name: Publish

# Every few hours: signs the packages that the repositories in packages.txt built since and
# publishes the [mabos] pacman repository to the "repo" release
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 30
    steps:
      - name: Git for the checkout
        run: pacman -Sy --noconfirm --needed git
      - uses: actions/checkout@v4
      - name: Publish
        run: scripts/publish.sh
        env:
          GH_TOKEN: ${{ github.token }}
          MABOS_SIGNING_KEY: ${{ secrets.MABOS_SIGNING_KEY }}
          MABOS_KEY_ID: ${{ vars.MABOS_KEY_ID }}
