# Builds this flake's packages and puts what cache.nixos.org lacks into the "cache" release, signed
# with MabOS's key. It runs on every push, every few hours and by hand; a commit already built is
# skipped, and only paths the release doesn't have are uploaded.
name: Build MabOS's packages

on:
  push:
    branches: [main]
    # A change to the text alone builds nothing new
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cache

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip a commit already built
        id: seen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view cache -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx "built-$GITHUB_SHA"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@v31
        if: steps.seen.outputs.skip != 'true'
        with:
          # Paths already in MabOS's cache are downloaded, not built again
          extra_nix_config: |
            extra-substituters = https://github.com/mabasterYT/mabos-packages/releases/download/cache
            extra-trusted-public-keys = mabos-cache-1:8tNp94HPkSJP6/lZpxfUms/743SFz1TsBPqET0sLuG0=

      - name: Build and upload
        if: steps.seen.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SECRET_KEY: ${{ secrets.MABOS_CACHE_KEY }}
        run: |
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SECRET_KEY" > "$key"
          MABOS_CACHE_KEY="$key" scripts/push.sh

      # Marks the commit as built, replacing the previous mark
      - name: Mark the commit
        if: steps.seen.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for old in $(gh release view cache -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep '^built-' || true); do
            gh release delete-asset cache "$old" -R "$GITHUB_REPOSITORY" --yes
          done
          echo "$GITHUB_SHA" > "built-$GITHUB_SHA"
          gh release upload cache "built-$GITHUB_SHA" -R "$GITHUB_REPOSITORY"
